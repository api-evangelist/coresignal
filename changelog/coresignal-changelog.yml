observations:
  - >-
    The change surface is overwhelmingly DATA-SHAPED, not endpoint-shaped: new and renamed record
    fields dominate every month, while the endpoint set changes rarely. Consumers of this API are
    exposed to schema drift far more than to route drift, and none of that drift is expressed in an
    OpenAPI Coresignal distributes.
  - >-
    Breaking changes carry an effective date that is typically 1–3 weeks after publication, which is
    the only lead time a consumer gets — there is no versioned schema they can pin to instead.
