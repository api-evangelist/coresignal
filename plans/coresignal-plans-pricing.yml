specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Coresignal
providerId: coresignal
created: '2026-05-04'
method: searched
modified: '2026-08-13'
generated: '2026-08-13'
source: https://docs.coresignal.com/pricing/pricing
reconciled: true
supersedes_note: >-
  Replaces a 2026-05-04 API Evangelist bulk-sweep generation that no longer matched what Coresignal
  publishes. That version described a 5-tier ladder with separate Collect and Search credit pools, a
  $1,000 Datasets product and a 20% annual discount. The published pricing is an 8-tier ladder with a
  SINGLE credit pool, a 10% annual discount, and no dataset line item on the pricing page. Every
  figure below is read from the provider's own pricing reference.
tags:
  - Agentic Search
  - B2B Data
  - Companies
  - Company Data
  - Data as a Service
  - Elasticsearch
  - Employee Data
  - Employees
  - Enrichment
  - Firmographics
  - Job Postings
  - Jobs
  - Lead Generation
  - People Data
  - Sales Intelligence
  - Talent Intelligence
  - Web Data
description: >-
  Coresignal sells API access to its B2B web data on a credit model. Credits are a single universal
  unit across every endpoint and plan; each plan includes a monthly (or annual) credit allocation and
  a credit cost is deducted per successful collect or enrich request. Search itself is free —
  /search/es_dsl and /search/filter deduct nothing — so the price of a query is entirely determined by
  how many records you actually pull and which dataset tier they come from (1 credit for a job or a
  post, 10 for Base/Clean company or employee, 20 for Multi-source). Eight published tiers run from a
  7-day free trial to a $5,000/month Elite plan, differentiated by credit count, requests-per-second
  rate limit, access to Search Preview and the Contact Enrichment API, credit rollover, and support
  model. Annual plans take 10% off and issue the full year of credits upfront.
sources:
  - https://docs.coresignal.com/pricing/pricing
  - https://coresignal.com/pricing/
  - https://docs.coresignal.com/api-introduction/credits
  - https://docs.coresignal.com/api-introduction/rate-limits
currency: USD
billing_periods: [monthly, annual]
annual_discount: 10%
annual_terms: >-
  Full annual credit allocation issued on the subscription start date, valid 12 months, single upfront
  payment, auto-renewing. Annual plans are offered from the Starter tier upward.
credit_model:
  unit: credit
  charged_on: successful (200) /collect and /enrich requests
  free_operations: [/search/es_dsl, /search/filter]
  balance_header: x-credits-remaining
  exhaustion_status: 402
  cost_per_record:
    - {endpoint: Base and Multi-source Jobs APIs, credits: 1}
    - {endpoint: Employee Posts APIs, credits: 1}
    - {endpoint: Company Posts APIs, credits: 1}
    - {endpoint: Base and Clean Company / Employee APIs, credits: 10}
    - {endpoint: Historical Headcount API, credits: 10}
    - {endpoint: Multi-source Company / Employee APIs, credits: 20}
    - {endpoint: Contact Enrichment API, credits: 20}
  search_preview:
    - {endpoint: Base and Clean Search Preview, credits: 10, per: query returning up to 20 results}
    - {endpoint: Multi-source Search Preview, credits: 20, per: query returning up to 20 results}
  agentic_search:
    basis: per query, in batches of 20 results; each additional batch of up to 20 adds 20 credits
    tiers:
      - {results: Elasticsearch query, fast: 20, reasoning: 100}
      - {results: 1-20, fast: 20, reasoning: 100}
      - {results: 21-40, fast: 40, reasoning: 120}
      - {results: 41-60, fast: 60, reasoning: 140}
      - {results: 61-80, fast: 80, reasoning: 160}
      - {results: 81-100, fast: 100, reasoning: 180}
  expiry:
    monthly: valid for one billing cycle, reset each month, no carry-over
    monthly_rollover: Premium, Scale and Elite carry unused credits up to 3 months
    annual: all credits issued upfront, valid 12 months from purchase
    trial: 7 days from registration
plan_count: 8
