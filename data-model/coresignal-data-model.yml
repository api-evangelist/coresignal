      nested_collections: [experience, education]
    filter_schema: openapi/_original/coresignal-multi-source-employee-api-openapi.yml#/components/schemas/EmployeeFilter
  - name: Job
    id_field: id
    id_type: integer
    schema: openapi/_original/coresignal-multi-source-jobs-api-openapi.yml#/components/schemas/Job
    json_schema: json-schema/coresignal-job-schema.json
