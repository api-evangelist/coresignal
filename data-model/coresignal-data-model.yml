  - name: Subscription
    id_field: id
    id_type: uuid
    source: https://docs.coresignal.com/api-introduction/webhooks/subscription-management
    fields:
      identity: [id]
      state: [status, created_at, expiring_at]
    note: >-
      Not present in any OpenAPI; derived from the documented subscription-management responses.
      Belongs to an API key / account, and tracks a population of Employee ids.
relationships:
  - from: Job
    to: Company
    cardinality: belongs_to
    via: company_name
    also_via: company_url
    strength: soft
    join_type: value-match
    note: >-
      No company id on the Job record. Resolve by searching the Company API for company_name (or by
      normalizing company_url to a domain and matching Company.website / Company.domain).
      arazzo/coresignal-company-to-jobs-workflow.yml implements this chain.
  - from: Employee
    to: Company
    cardinality: belongs_to
    via: active_experience_company_name
    strength: soft
    join_type: value-match
    note: >-
      The EmployeeFilter exposes active_experience_company_name and active_experience_title, which is
      how the catalog's company→employees workflow resolves a workforce. The Employee RECORD itself
      carries the association inside the experience[] array rather than as a top-level company id.
      arazzo/coresignal-company-to-employees-workflow.yml implements this chain.
  - from: Employee
    to: Experience
    cardinality: has_many
    via: experience
    strength: embedded
    note: >-
      Embedded array. Since 2026-08-01 each entry carries experience[].id, a profile hash id that
      finally makes an individual position addressable.
  - from: Employee
    to: Education
    cardinality: has_many
    via: education
    strength: embedded
    note: Embedded array; education[].id added 2026-08-01.
  - from: Company
    to: AffiliatedCompany
    cardinality: has_many
    via: affiliated_pages
    strength: hard
    join_type: id-reference
    note: >-
      affiliated_pages[].affiliated_company_id was added to Base Company data on 2026-08-01 and
      backfilled. This is the only true id-to-id reference Coresignal publishes — a Company pointing
      at another Company.
  - from: Subscription
    to: Employee
    cardinality: has_many
    via: tracked population (id list, search filter, or ES DSL query)
    strength: query-defined
    note: Notifications arrive as member_id, which is Employee.id.
access_pattern:
  shape: two-step search-then-collect
  step_1: POST /search/es_dsl or /search/filter -> array of record IDs (free)
  step_2: GET /collect/{id} or POST /bulk_collect -> full records (credit-charged)
  shortcut: /search/*/preview returns up to 20 full records in one charged call
  note: >-
    The ID array returned by step 1 is the join key for everything else. Any traversal across entities
    is the consumer's job.
identifier_conventions:
  prefixes: none
  format: bare integers per entity, not globally unique across entities
  uuid_usage: subscription ids only
  note: >-
    A bare integer id is only meaningful together with the entity AND the dataset tier it came from —
    Base, Clean and Multi-source are separate ID spaces addressed by separate base paths.
