  json-schema/*.json
docs: https://docs.coresignal.com/data-introduction/data-overview
note: >-
  Coresignal's model is three PARALLEL record types, not a normalized graph. There are no foreign-key
  fields between Company, Employee and Job in the published schemas — the entities are joined by
  VALUE, not by id: a Job carries company_name/company_url and an Employee carries
  active_experience_company_name, both of which are strings you match back to a Company record
  yourself. That soft-join is the single most important thing an integrator needs to know about this
  data model, and it is why the arazzo/ workflows in this repo chain search→search rather than
  following a reference. Relationships below are marked with the field that carries the join and
  their real strength.
entities:
  - name: Company
    id_field: id
    id_type: integer
    schema: openapi/_original/coresignal-multi-source-company-api-openapi.yml#/components/schemas/Company
    json_schema: json-schema/coresignal-company-schema.json
    tier_variants: [Base Company, Clean Company, Multi-source Company]
    freshness_field: last_updated
    fields:
      identity: [id, name, website, domain, linkedin_url, twitter_url, facebook_url, crunchbase_url]
      firmographic: [industry, type, founded, size, employees_count, followers_count, description]
      location: [headquarters, country, region, locality]
      commercial: [specialities, technologies, funding_total_amount, last_funding_round]
    filter_schema: openapi/_original/coresignal-multi-source-company-api-openapi.yml#/components/schemas/CompanyFilter
  - name: Employee
